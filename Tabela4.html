<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 4</title>
</head>
<body>
    <main>
        <table border='1' width="100%" style="text-align: centers;">
            <tr>
                <th rowspan="3">Day</th>
                <th colspan="3">Seminar</th>
            </tr>
            <tr>
                <th colspan="2">Schedule</th>
                <th rowspan="2">Topic</th>
            </tr>
            <tr>
                <th>Begin</th>
                <th>End</th>
            </tr>
            <tr>
                <td rowspan="2">Monday</td>
                <td rowspan="2" style="text-align: center; background-color: yellow;">8:00 a.m.</td>
                <td rowspan="2" style="text-align: center; background-color: blue;">5:00 p.m.</td>
                <td style="text-align: center;">Introduction to XML</td>
            </tr>
            <tr>
                <td style="text-align: center;">Validity: DTD and Relax NG</td>
            </tr>
            <tr style="text-align: center;">
                <td rowspan="3" style="text-align: left;">Tuesday</td>
                <td style="background-color: yellow;">8:00 a.m.</td>
                <td style="background-color: yellow;">11:00 a.m.</td>
                <td rowspan="2">XPath</td>
            </tr>
            <tr style="text-align: center;">
                <td style="background-color: yellow;">11:00 a.m.</td>
                <td style="background-color: green;">2:00 p.m.</td>
            </tr>
            <tr style="text-align: center;">
                <td style="background-color: green;">2:00 p.m.</td>
                <td style="background-color: blue;">5:00 p.m.</td>
                <td>XSL Transformations</td>
            </tr>
            <tr style="text-align: center;">
                <td style="text-align: left;">Wednesday</td>
                <td style="background-color: yellow;">8:00 a.m.</td>
                <td style="background-color: green;">12:00 p.m.</td>
                <td>XSL Formating Objects</td>
            </tr>
        </table>
    </main>
</body>
</html>
